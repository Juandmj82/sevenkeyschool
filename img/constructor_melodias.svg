<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 483 362" width="483" height="362">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141729"/>
      <stop offset="100%" stop-color="#0b0d19"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="483" height="362" fill="url(#bg)"/>
  <circle cx="241" cy="170" r="150" fill="url(#glow)"/>

  <!-- Staff with note blocks -->
  <g stroke="rgba(255,255,255,0.3)" stroke-width="2">
    <line x1="70" y1="140" x2="413" y2="140"/>
    <line x1="70" y1="160" x2="413" y2="160"/>
    <line x1="70" y1="180" x2="413" y2="180"/>
    <line x1="70" y1="200" x2="413" y2="200"/>
    <line x1="70" y1="220" x2="413" y2="220"/>
  </g>

  <g>
    <ellipse cx="140" cy="180" rx="12" ry="8" fill="#ef4444" transform="rotate(-20 140 180)"/>
    <ellipse cx="200" cy="140" rx="12" ry="8" fill="#f97316" transform="rotate(-20 200 140)"/>
    <ellipse cx="260" cy="200" rx="12" ry="8" fill="#eab308" transform="rotate(-20 260 200)"/>
    <ellipse cx="320" cy="160" rx="12" ry="8" fill="#00e5ff" transform="rotate(-20 320 160)"/>
    <ellipse cx="380" cy="120" rx="12" ry="8" fill="#a855f7" transform="rotate(-20 380 120)"/>
  </g>

  <g fill="#d4af37" opacity="0.45" font-family="Georgia, serif">
    <text x="55" y="80" font-size="28">♪</text>
    <text x="410" y="70" font-size="26">♫</text>
    <text x="395" y="300" font-size="28">♪</text>
    <text x="55" y="290" font-size="24">♬</text>
  </g>

  <text x="241" y="335" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" fill="#f1f5f9">Constructor de Melodías</text>
</svg>
