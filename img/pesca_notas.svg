<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 483 362" width="483" height="362">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2b3a"/>
      <stop offset="100%" stop-color="#0b0d19"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="483" height="362" fill="url(#bg)"/>
  <circle cx="241" cy="150" r="160" fill="url(#glow)"/>

  <!-- Fish -->
  <g>
    <g transform="translate(140,150)">
      <polygon points="-28,0 -42,-14 -42,14" fill="#ef4444"/>
      <ellipse cx="0" cy="0" rx="28" ry="19" fill="#ef4444" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
      <circle cx="13" cy="-6" r="3" fill="#0b0d19"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="13" fill="#0b0d19">DO</text>
    </g>
    <g transform="translate(230,110)">
      <polygon points="28,0 42,-14 42,14" fill="#00e5ff"/>
      <ellipse cx="0" cy="0" rx="28" ry="19" fill="#00e5ff" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
      <circle cx="-13" cy="-6" r="3" fill="#0b0d19"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="13" fill="#0b0d19">SOL</text>
    </g>
    <g transform="translate(330,190)">
      <polygon points="-28,0 -42,-14 -42,14" fill="#eab308"/>
      <ellipse cx="0" cy="0" rx="28" ry="19" fill="#eab308" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
      <circle cx="13" cy="-6" r="3" fill="#0b0d19"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="13" fill="#0b0d19">MI</text>
    </g>
  </g>

  <!-- Simple fishing hook line -->
  <line x1="380" y1="20" x2="330" y2="170" stroke="#f1f5f9" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>
  <path d="M330 170 q -8 14 4 18 q 10 3 10 -8" fill="none" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>

  <g fill="#d4af37" opacity="0.45" font-family="Georgia, serif">
    <text x="55" y="70" font-size="28">♪</text>
    <text x="410" y="290" font-size="26">♫</text>
  </g>

  <text x="241" y="335" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="24" fill="#f1f5f9">Pesca Notas</text>
</svg>
